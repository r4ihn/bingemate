# Local dev databases. Bound to 127.0.0.1 only — never exposed on the network.
# Usage: npm run up   (or docker compose up -d, then prisma migrate + seed)
# Host ports come from POSTGRES_PORT / MONGO_PORT in the root .env (gitignored), which
# `npm run up` fills with free ports per machine. Unset, they default to 5432 / 27017.
services:
  postgres:
    image: postgres:16-alpine
    container_name: bingemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingemate
      POSTGRES_PASSWORD: bingemate
      POSTGRES_DB: bingemate
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bingemate']
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: bingemate-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
