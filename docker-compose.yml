# Local dev databases. Bound to 127.0.0.1 only — never exposed on the network.
# Usage: docker compose up -d   (then prisma migrate + seed)
services:
  postgres:
    image: postgres:16-alpine
    container_name: bingemate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bingemate
      POSTGRES_PASSWORD: bingemate
      POSTGRES_DB: bingemate
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bingemate']
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: bingemate-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
