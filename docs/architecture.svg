<text class="ts" x="52" y="516">Immediate + every 1 min; also startup-if-empty + TRENDING_REFRESH_MINUTES</text>
<text class="ts" x="52" y="531">SQL trending_titles + Mongo recent-count aggregation → upsert cards → refresh ranks</text>
</g>
