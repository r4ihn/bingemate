<text class="ts" x="52" y="436">1. PG transaction: row lock Title → insert Review → recompute avgRating / reviewCount</text>
<text class="ts" x="52" y="451">2. Mongo ReviewBody._id = Review.id → 3. If 2 fails: undo header + totals (best effort)</text>
</g>
