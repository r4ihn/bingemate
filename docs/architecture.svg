<line x1="497" y1="566" x2="497" y2="546" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="568" width="600" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="586" text-anchor="middle" dominant-baseline="central">Tooling (not part of runtime)</text><text class="ts" x="340" y="606" text-anchor="middle" dominant-baseline="central">ETL scripts, benchmarks</text></g>
<text class="ts" x="40" y="652" text-anchor="start" dominant-baseline="central">Dashed outline = planned, not built</text>
</svg>
