<svg xmlns="http://www.w3.org/2000/svg" width="680" height="676" viewBox="0 0 680 676" role="img">
<title>BingeMate layered architecture</title>
<desc>Three tiers: a client tier with the browser and React SPA, an application tier with the Express request pipeline, feature modules, reviews service and a planned trending job, and a data tier with PostgreSQL and MongoDB. Tooling scripts sit outside the runtime and load both databases.</desc>
<style>
  text { font-family: Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .c-purple > rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple > .th { fill: #3C3489; }
  .c-teal > rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal > .th { fill: #085041; }
  .c-gray > rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray > .th { fill: #444441; }
  .c-gray > .ts { fill: #5F5E5A; }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect x="0" y="0" width="680" height="676" fill="#FFFFFF"/>

<g class="c-purple"><rect x="20" y="20" width="640" height="100" rx="16" stroke-width="0.5"/><text class="th" x="40" y="42" text-anchor="start" dominant-baseline="central">Client tier</text></g>
<g class="c-gray"><rect x="40" y="62" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="125" y="84" text-anchor="middle" dominant-baseline="central">User (browser)</text></g>
<g class="c-gray"><rect x="240" y="62" width="400" height="44" rx="8" stroke-width="0.5"/><text class="th" x="440" y="84" text-anchor="middle" dominant-baseline="central">React SPA (Vite, TypeScript, Tailwind)</text></g>
<line x1="210" y1="84" x2="238" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="440" y1="120" x2="440" y2="148" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="452" y="136" text-anchor="start" dominant-baseline="central">HTTPS + cookie</text>

<g class="c-purple"><rect x="20" y="150" width="640" height="236" rx="16" stroke-width="0.5"/><text class="th" x="40" y="172" text-anchor="start" dominant-baseline="central">Application tier: Express API (Node.js, TypeScript)</text></g>
<g class="c-gray"><rect x="40" y="192" width="135" height="52" rx="8" stroke-width="0.5"/><text class="th" x="107" y="208" text-anchor="middle" dominant-baseline="central">Rate limit</text><text class="ts" x="107" y="228" text-anchor="middle" dominant-baseline="central">CORS, JSON body</text></g>
<g class="c-gray"><rect x="195" y="192" width="135" height="52" rx="8" stroke-width="0.5"/><text class="th" x="262" y="208" text-anchor="middle" dominant-baseline="central">Validation</text><text class="ts" x="262" y="228" text-anchor="middle" dominant-baseline="central">Zod schemas</text></g>
<g class="c-gray"><rect x="350" y="192" width="135" height="52" rx="8" stroke-width="0.5"/><text class="th" x="417" y="208" text-anchor="middle" dominant-baseline="central">Authenticate</text><text class="ts" x="417" y="228" text-anchor="middle" dominant-baseline="central">JWT from cookie</text></g>
<g class="c-gray"><rect x="505" y="192" width="135" height="52" rx="8" stroke-width="0.5"/><text class="th" x="572" y="208" text-anchor="middle" dominant-baseline="central">Authorize</text><text class="ts" x="572" y="228" text-anchor="middle" dominant-baseline="central">Role check</text></g>
<line x1="175" y1="218" x2="193" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="218" x2="348" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="485" y1="218" x2="503" y2="218" class="arr" marker-end="url(#arrow)"/>
<line x1="572" y1="244" x2="572" y2="266" class="arr"/>
<line x1="572" y1="266" x2="145" y2="266" class="arr"/>
<line x1="145" y1="266" x2="145" y2="300" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="266" x2="340" y2="300" class="arr" marker-end="url(#arrow)"/>
<line x1="535" y1="266" x2="535" y2="300" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="40" y="302" width="210" height="56" rx="8" stroke-width="0.5"/><text class="th" x="145" y="320" text-anchor="middle" dominant-baseline="central">Feature modules</text><text class="ts" x="145" y="340" text-anchor="middle" dominant-baseline="central">Titles, lists, admin</text></g>
<g class="c-gray"><rect x="265" y="302" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="320" text-anchor="middle" dominant-baseline="central">Reviews service</text><text class="ts" x="340" y="340" text-anchor="middle" dominant-baseline="central">1. header, 2. body</text></g>
<g class="c-gray"><rect x="430" y="302" width="210" height="56" rx="8" stroke-width="0.5" stroke-dasharray="5 4"/><text class="th" x="535" y="320" text-anchor="middle" dominant-baseline="central">Trending job</text><text class="ts" x="535" y="340" text-anchor="middle" dominant-baseline="central">Planned, not built</text></g>

<g class="c-teal"><rect x="20" y="420" width="640" height="124" rx="16" stroke-width="0.5"/><text class="th" x="40" y="530" text-anchor="start" dominant-baseline="central">Data tier (Docker Compose)</text></g>
<g class="c-gray"><rect x="40" y="456" width="285" height="56" rx="8" stroke-width="0.5"/><text class="th" x="182" y="474" text-anchor="middle" dominant-baseline="central">PostgreSQL 16</text><text class="ts" x="182" y="494" text-anchor="middle" dominant-baseline="central">Users, titles, lists, ratings</text></g>
<g class="c-gray"><rect x="355" y="456" width="285" height="56" rx="8" stroke-width="0.5"/><text class="th" x="497" y="474" text-anchor="middle" dominant-baseline="central">MongoDB 7</text><text class="ts" x="497" y="494" text-anchor="middle" dominant-baseline="central">Review bodies, comments, cards</text></g>

<line x1="145" y1="358" x2="145" y2="454" class="arr" marker-end="url(#arrow)"/>
<line x1="300" y1="358" x2="250" y2="454" class="arr" marker-end="url(#arrow)"/>
