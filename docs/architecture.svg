<svg xmlns="http://www.w3.org/2000/svg" width="680" height="850" viewBox="0 0 680 850" role="img" aria-labelledby="title desc">
<title id="title">BingeMate architecture implemented in code</title>
<desc id="desc">React browser client sends a JWT in an httpOnly cookie to Express. App middleware parses JSON and cookies and applies CORS; authentication, role checks and Zod validation belong to individual routes or feature routers. Only login, registration and poster PUT and DELETE are rate limited. Built feature modules use PostgreSQL through Prisma and MongoDB through Mongoose. Review creation commits a locked PostgreSQL transaction before writing a MongoDB body with the same id, with compensating deletion on failure. Two server schedulers and a CLI refresh trending cards from SQL and Mongo aggregation, then refresh title ranks. Separate admin user, role and review moderation endpoints are planned. ETL, maintenance, benchmarks and real database tests are outside runtime tiers.</desc>
